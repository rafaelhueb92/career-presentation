name: Deploy Career Presentation

# Provisions/updates the AWS infrastructure with Pulumi, then publishes the
# static site to S3 and invalidates CloudFront. Authentication to AWS is
# keyless via GitHub OIDC — no long-lived access keys are stored.

on:
  push:
    branches: [master]
    paths:
      - "index.html"
      - "assets/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

# Least-privilege token: OIDC needs id-token, checkout needs contents.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PULUMI_STACK: ${{ vars.PULUMI_STACK || 'prod' }}

jobs:
  deploy:
    name: Provision & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pulumi CLI
        uses: pulumi/actions@v6

      - name: Install infra dependencies
        working-directory: infra
        run: |
          python -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt

      - name: Provision infrastructure (pulumi up)
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: ${{ env.PULUMI_STACK }}
          work-dir: infra
          upsert: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Read stack outputs
        id: outputs
        working-directory: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          echo "bucket=$(pulumi stack output bucketName --stack $PULUMI_STACK)"                >> "$GITHUB_OUTPUT"
          echo "distribution=$(pulumi stack output distributionId --stack $PULUMI_STACK)"      >> "$GITHUB_OUTPUT"
          echo "url=$(pulumi stack output siteUrl --stack $PULUMI_STACK)"                      >> "$GITHUB_OUTPUT"

      - name: Publish assets (long-lived cache)
        run: |
          aws s3 sync assets/ "s3://${{ steps.outputs.outputs.bucket }}/assets/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Publish HTML (always revalidate)
        run: |
          aws s3 cp index.html "s3://${{ steps.outputs.outputs.bucket }}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution }}" \
            --paths "/*"

      - name: Summary
        run: |
          echo "### ✅ Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Live URL:** ${{ steps.outputs.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
